<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AnDrOID icon: sphere split into the orbital phase colours (blue / green) with "AD" -->
  <defs>
    <clipPath id="ball">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
    <radialGradient id="shade" cx="34%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="32" height="64" fill="#2f6fdf"/>
    <rect x="32" y="0" width="32" height="64" fill="#2ca02c"/>
    <circle cx="32" cy="32" r="31" fill="url(#shade)"/>
  </g>
  <text x="32" y="43.5" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="30"
        fill="#ffffff" stroke="#000000" stroke-opacity="0.35" stroke-width="1.2" paint-order="stroke">AD</text>
</svg>
